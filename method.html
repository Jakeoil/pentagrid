<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pentagrid — De Bruijn's Method</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="stylesheet" href="./site.css">
    <style>
        /* Only what this page ADDS to site.css: the column's extra room, the
           narrative's furniture, and the stage. The shell, the reticulum, the
           dials, the panel, the floating panel and the presets are all shared
           now — this page used to carry its own copy of every one of them, which
           is why it drifted. method and split are going to be one page with a
           mode; they may as well already look like it. */

        /* The wrap keeps the reading measure; the stage below it does not. */
        .wrap { padding-bottom: 8px; }
        .bench-link { font-size: 12px; color: var(--ink-faint); margin: 0 0 10px; }

        /* The narrative: which step, the buttons either side, the build stamp. */
        .step-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin: 6px 0;
        }
        .step-nav button {
            padding: 6px 18px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 4px;
        }
        .step-nav button:hover:not(:disabled) { background: #eee; }
        .step-nav button:disabled { opacity: 0.35; cursor: default; }
        .build-tag { font-size: 12px; font-family: ui-monospace, Menlo, monospace; color: #aaa; }
        .step-indicator {
            font-size: 14px;
            color: var(--ink-soft);
            font-family: ui-monospace, Menlo, monospace;
        }

        /* The text, above the instrument. The block is centered by the column;
           the prose inside it is not — centered body text is harder to read, and
           the equations center themselves already. */
        .explanation { font-size: 15px; line-height: 1.6; color: #333; padding-top: 8px; }
        .explanation h3 { margin: 0 0 12px; font-size: 18px; color: #222; }
        .explanation .equation {
            font-size: 17px;
            text-align: center;
            margin: 16px 0;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 4px;
            font-family: "Times New Roman", serif;
        }
        .legend { display: flex; gap: 20px; margin: 12px 0; font-size: 14px; }
        .legend-swatch {
            display: inline-block;
            width: 16px; height: 16px;
            border-radius: 3px;
            vertical-align: middle;
            margin-right: 4px;
            border: 1px solid #aaa;
        }

        /* Two panel columns and the same collapse split has, to the breakpoint:
           the grid's rows on the left, the dual's on the right, one column when
           there is no room for two. One canvas under them, since there is one
           here — which is the only difference between the two layouts, and the
           reason they can become a mode of one page. */
        .panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 20px;
            align-items: start;
            margin: 16px 0 8px;
        }
        @media (max-width: 1240px) {
            .panels { grid-template-columns: 1fr; }
        }

        /* The stage is OUTSIDE the wrap, so the picture is not held to the
           reading measure: there is one canvas here and it has the page to
           itself. The largest square the window allows, and room below it to
           scroll that square into the middle of the view. */
        .stage { padding: 0 20px 40vh; }
        #canvas-container {
            position: relative;
            width: min(100%, 92vh);
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            background: #fff;
            touch-action: none;
        }
    </style>
</head>
<body>
<nav class="site">
    <span class="brand">Pentagrid</span>
    <a href="./" draggable="false">Home</a>
    <a href="method.html" draggable="false" aria-current="page">Method</a>
    <a href="grow.html" draggable="false">Grow</a>
    <a href="grow7.html" draggable="false">Grow 7</a>
    <a href="multigrid.html" draggable="false">Multigrid</a>
    <a href="roof.html" draggable="false">Roof</a>
    <a href="sunstar.html" draggable="false">Sun &amp; Star</a>
    <a href="split.html" draggable="false">Split</a>
    <a href="wiggle.html" draggable="false">Wiggle</a>
</nav>
    <div class="wrap">
        <p class="bench-link">bench (temporary): <a href="ui-test/arrows.html">arrows</a></p>
        <h1>Pentagrid</h1>
        <h2>De Bruijn's Pentagrid Method</h2>
        <!-- Read down the page: which step you are on, what it says, then the
             instrument it is about. The text used to sit in a column beside the
             canvas, 340px wide, which made it the narrowest thing on a page
             whose whole point is the picture. -->
        <div class="step-nav" id="step-nav"></div>
        <div class="explanation" id="explanation"></div>
        <div class="controls" id="controls"></div>
        <div class="panels">
            <div class="layer-panel" id="layer-panel"></div>
            <div class="layer-panel" id="layer-panel-p"></div>
        </div>
    </div>
    <div class="stage"><div id="canvas-container"></div></div>
    <script type="module" src="./dist/method.js"></script>
</body>
</html>
